# ===============================
# 🗄️ DATABASE CONNECTION (MySQL)
# ===============================
# FIX: Added allowPublicKeyRetrieval=true
spring.datasource.url=jdbc:mysql://localhost:3306/money_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# ⚙️ HIBERNATE / JPA SETTINGS
# ===============================
spring.jpa.hibernate.ddl-auto=update

# Database me jo SQL queries hit hongi wo console par dikhengi
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# FIX: Updated Dialect for Hibernate 6/7
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# 🚀 SERVER PORT
# ===============================
server.port=8080
